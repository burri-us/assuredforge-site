name: pages
# Deploys only when started by hand (Actions → pages → Run workflow), never on push: every deployment is a deliberate,
# approved step. "preview" builds for <owner>.github.io/assuredforge-site; "custom-domain" builds for the site's own
# domain. Both keep search engines out unless "index" is ticked (publication).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where the build will be served
        type: choice
        options: [preview, custom-domain]
        default: preview
      index:
        description: Let search engines index the site (publication only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and check
        env:
          BASE_PATH: ${{ inputs.target == 'preview' && format('/{0}', github.event.repository.name) || '' }}
          SITE_INDEX: ${{ inputs.index && '1' || '0' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
